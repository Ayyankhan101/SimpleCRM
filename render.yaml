        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_8NKtLl4fkjnX@ep-hidden-sky-b5l9moai.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
