services:
  - type: web
    name: data-analytics-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: data-analytics-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: data-analytics-db
    plan: free
