app = 'simplecrm-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  FLASK_ENV = 'production'
  FRONTEND_URL = 'https://frontend-navy-psi-33.vercel.app'
  ENFORCE_HTTPS = 'true'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
