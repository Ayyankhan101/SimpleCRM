name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-flask pytest-cov
      
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: backend/coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Lint backend
        run: ruff check backend/

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t data-analytics-backend .
      
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t data-analytics-frontend .
